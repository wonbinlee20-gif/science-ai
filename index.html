<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>중3 질문 조교</title>
</head>

<body>
  <h2>중3 과학 질문 조교</h2>

  <textarea id="question" rows="5" cols="60"></textarea>
  <br><br>
  <button onclick="ask()">질문하기</button>

  <p id="status"></p>
  <pre id="answer" style="white-space: pre-wrap;"></pre>

  <script>
    async function ask() {
      const q = document.getElementById("question").value;
      const status = document.getElementById("status");
      const answer = document.getElementById("answer");

      status.innerText = "답변 생성 중...";
      answer.innerText = "";

      try {
        const res = await fetch("/api", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question: q })
        });

        const data = await res.json();

        if (!res.ok) {
          status.innerText = "오류 발생";
          answer.innerText = JSON.stringify(data, null, 2);
          return;
        }

        status.innerText = "완료";
        answer.innerText = data.answer || "답변 없음";
      } catch (err) {
        status.innerText = "에러";
        answer.innerText = String(err);
      }
    }
  </script>

</body>
</html>
